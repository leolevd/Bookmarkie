<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8fff0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2fe0b0" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="tail3" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7ffbd8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7ffbd8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Swoop along a wavy path, ghost faces direction of travel (right) -->
  <g>
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M-160,260 C100,60 300,360 560,200 S960,40 1360,230"/>

    <g filter="url(#glow3)">
      <animate attributeName="opacity" values="0.85;0.45;0.9;0.5;0.85" keyTimes="0;0.2;0.45;0.75;1" dur="2.2s" repeatCount="indefinite"/>

      <!-- Long wispy tail trailing behind (to the left) -->
      <path fill="url(#tail3)" d="M-30,-20 C-120,-30 -200,10 -300,-5 C-210,25 -140,45 -60,40 C-110,60 -170,70 -250,95 C-150,90 -80,80 -20,50 Z">
        <animate attributeName="d"
          values="M-30,-20 C-120,-30 -200,10 -300,-5 C-210,25 -140,45 -60,40 C-110,60 -170,70 -250,95 C-150,90 -80,80 -20,50 Z;
                  M-30,-20 C-120,-10 -200,-20 -300,10 C-210,35 -140,30 -60,40 C-110,50 -170,95 -250,80 C-150,100 -80,70 -20,50 Z;
                  M-30,-20 C-120,-30 -200,10 -300,-5 C-210,25 -140,45 -60,40 C-110,60 -170,70 -250,95 C-150,90 -80,80 -20,50 Z"
          dur="1.4s" repeatCount="indefinite"/>
      </path>

      <!-- Body: tattered hem, leaning into the flight -->
      <g transform="rotate(-12)">
        <path fill="url(#body3)" stroke="#b6ffe8" stroke-opacity="0.6" stroke-width="2"
          d="M0,-62 C-40,-62 -50,-25 -50,5 L-52,62 L-40,48 L-34,80 L-22,52 L-12,86 L0,56 L10,90 L22,54 L34,82 L40,50 L52,64 L50,5 C50,-25 40,-62 0,-62 Z"/>
        <!-- Hollow eyes with glowing pupils -->
        <ellipse cx="-16" cy="-22" rx="10" ry="14" fill="#031a12"/>
        <ellipse cx="16" cy="-22" rx="10" ry="14" fill="#031a12"/>
        <circle cx="-16" cy="-20" r="3.5" fill="#9bffe0">
          <animate attributeName="r" values="3.5;5;3.5" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="16" cy="-20" r="3.5" fill="#9bffe0">
          <animate attributeName="r" values="3.5;5;3.5" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <!-- Wailing mouth -->
        <ellipse cx="0" cy="14" rx="9" ry="16" fill="#031a12">
          <animate attributeName="ry" values="16;24;12;16" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="rx" values="9;12;8;9" dur="1.6s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
  </g>
</svg>
