<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>


  <!-- Flight path: left to right -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-120,0; 1320,0" dur="9s" repeatCount="indefinite"/>

    <!-- Bob -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,190; 0,160; 0,190; 0,220; 0,190" dur="2.4s" repeatCount="indefinite"/>

      <!-- Tilt -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-6;6;-6" dur="2.4s" repeatCount="indefinite"/>

        <g filter="url(#glow1)">
          <animate attributeName="opacity" values="0.8;0.55;0.8" dur="1.6s" repeatCount="indefinite"/>
          <!-- Body -->
          <path fill="url(#body1)" stroke="#e8f6ff" stroke-opacity="0.6" stroke-width="2"
            d="M0,-60 C-45,-60 -55,-20 -55,10 L-55,70 Q-46,58 -37,72 Q-28,58 -18,72 Q-9,58 0,72 Q9,58 18,72 Q28,58 37,72 Q46,58 55,70 L55,10 C55,-20 45,-60 0,-60 Z"/>
          <!-- Arms -->
          <ellipse cx="-62" cy="18" rx="14" ry="9" fill="#ffffff" fill-opacity="0.55">
            <animateTransform attributeName="transform" type="rotate" values="-15 -55 10;15 -55 10;-15 -55 10" dur="1.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="62" cy="18" rx="14" ry="9" fill="#ffffff" fill-opacity="0.55">
            <animateTransform attributeName="transform" type="rotate" values="15 55 10;-15 55 10;15 55 10" dur="1.2s" repeatCount="indefinite"/>
          </ellipse>
          <!-- Face -->
          <ellipse cx="-17" cy="-15" rx="8" ry="11" fill="#10142a"/>
          <ellipse cx="17" cy="-15" rx="8" ry="11" fill="#10142a"/>
          <ellipse cx="0" cy="12" rx="9" ry="12" fill="#10142a">
            <animate attributeName="ry" values="12;7;12" dur="2.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>
    </g>
  </g>
</svg>
